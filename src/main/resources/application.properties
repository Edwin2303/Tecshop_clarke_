spring.application.name=Tecshop

#para definior el puerto en el que "que escucha" mi pagina 
server.port=80

#para definir el formato de dspliegue de fecha/hora del log en la consola 
logging.pattern.dateformat=hh:mm

#eliminacion de mensajes invasivos de spring
spring.main.banner-mode=off

#en desarollo el "cache" del servidor (false), en produccion "true"
spring.thymeleaf.cache=false